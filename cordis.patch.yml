# dsh-timer-agent bundle patch: inserts the plugin row into a profile roster.
# Applied as a profile bundle layer (the `dsh.bundle.patch` manifest field) over
# dsh-base; activate with `dsh plugin --profile <name> add link:<this directory>`
# (any host profile works, not just `web`).
#
# The row is a bare plugin by package name: the node half (exports ".") runs in
# the host process (the ticker, the `timer_agent` tool, the system-prompt
# announcement, and — when the profile mounts one — the web routes). A profile
# without `dsh web` has no `webServer`, and the host half works there anyway;
# the `dsh.client` declaration in package.json additionally serves the browser
# half (exports "./client", /plugins/<id>/client.js) to the web GUI.
- insert:
    - id: ui-timer-agent
      name: 'dsh-timer-agent'
